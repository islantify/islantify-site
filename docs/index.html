  <style>
    body {
      background-color: #030712 !important;
      color: #94a3b8;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .live-demo-layout {
      max-width: 1050px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
      gap: 20px;
      align-items: stretch;
    }
    .live-demo-info {
      padding: 28px;
      border-radius: 24px;
      border: 1px solid rgba(249, 115, 22, 0.15);
      background: linear-gradient(145deg, #0f121d, #05070f);
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .info-eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      color: #10b981;
      margin-bottom: 12px;
    }
    .live-demo-info h3 { margin: 0 0 12px; font-size: 30px; color: #ffffff; }
    .live-demo-info p { margin: 0 0 24px; line-height: 1.6; opacity: .85; }
    .info-points { display: grid; gap: 14px; }
    .info-points div {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .info-points div:hover {
      border-color: rgba(249, 115, 22, 0.3);
      background: rgba(249, 115, 22, 0.02);
    }
    .info-points strong { display: block; font-size: 12px; letter-spacing: .08em; margin-bottom: 5px; color: #ffffff; }
    .info-points span { display: block; font-size: 13px; line-height: 1.45; opacity: .7; }
    .live-demo-layout .live-demo-card { width: 100%; max-width: none !important; margin: 0 !important; }

    @media (max-width: 768px) {
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: flex !important; }
      .live-demo-layout { grid-template-columns: 1fr; }
    }

    .policy-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-family: sans-serif;
    }
    .policy-modal-content {
      background-color: #070a14;
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 24px;
      max-width: 700px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 2.5rem;
      position: relative;
      color: #94a3b8;
      box-shadow: 0 0 40px rgba(249, 115, 22, 0.1);
    }
    .policy-modal-content h2 { color: #ffffff; margin-top: 0; font-size: 1.75rem; }
    .policy-modal-content h3 { color: #ffffff; margin-top: 1.5rem; font-size: 1.1rem; }
    .policy-modal-content p { font-size: 0.95rem; line-height: 1.6; }
    .close-modal-btn {
      position: absolute;
      top: 1.25rem; right: 1.25rem;
      background: #0f121d;
      border: 1px solid #1e293b;
      color: white;
      border-radius: 50%;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .close-modal-btn:hover { border-color: #f97316; color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
  </style>
